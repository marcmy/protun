version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # pvpnclient/muon are resolved from Proton's separate Cargo registry.
    # A private-registry authentication requirement must be configured in
    # Dependabot separately, never embedded in this file.

  - package-ecosystem: gradle
    directory: /vpn-core-android
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
