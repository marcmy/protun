version: 2
# Proton publishes these crates publicly; registering the host allows
# Dependabot's otherwise restrictive network proxy to reach its Cargo index.
registries:
  proton:
    type: cargo-registry
    registry: proton
    url: https://rust-registry.proton.me/index/
    # Public index, but Dependabot requires a secret-backed token setting.
    # PROTON_REGISTRY_READ_TOKEN is stored as a Dependabot secret (not an
    # Actions secret). Its value is a nonprivileged placeholder for this
    # publicly readable registry.
    token: "${{secrets.PROTON_REGISTRY_READ_TOKEN}}"
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    registries:
      - proton
    # Keep blocked/unusable major lines out of routine Dependabot PRs.
    # bincode 3.0.0 intentionally has compile_error! in its root module.
    # UniFFI >=0.32 is ahead of C# uniffi-bindgen-cs (currently 0.31).
    # pvpnclient 5.1.0 still uses muon 3.x; muon 4+ splits API types.
    ignore:
      - dependency-name: "bincode"
        versions: [">= 3.0.0"]
      - dependency-name: "uniffi"
        versions: [">= 0.32.0"]
      - dependency-name: "muon"
        versions: [">= 4.0.0"]
    # If authentication becomes necessary, reference a Dependabot secret
    # rather than checking a real credential into this file.

  - package-ecosystem: gradle
    directory: /vpn-core-android
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
