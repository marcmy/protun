version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # pvpnclient/muon are resolved from Proton's separate Cargo registry.
    # A private-registry authentication requirement must be configured in
    # Dependabot separately, never embedded in this file.

  - package-ecosystem: gradle
    directory: /vpn-core-android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Hilt >= 2.59 requires AGP 9. Keep AGP 8.13 compatibility.
    # Revisit these bounds together with the next AGP major upgrade.
    ignore:
      - dependency-name: "com.google.dagger:hilt-android"
        versions: ["[2.59,)"]
      - dependency-name: "com.google.dagger:hilt-compiler"
        versions: ["[2.59,)"]
      - dependency-name: "com.google.dagger.hilt.android:com.google.dagger.hilt.android.gradle.plugin"
        versions: ["[2.59,)"]
