version: 2
# Proton publishes these crates publicly; registering the host allows
# Dependabot's otherwise restrictive network proxy to reach its Cargo index.
registries:
  proton:
    type: cargo-registry
    registry: proton
    url: https://rust-registry.proton.me/index/
    # Public index, but Dependabot requires a secret-backed token setting.
    # Configure the Dependabot secret PROTON_REGISTRY_READ_TOKEN with an
    # anonymous placeholder if the registry accepts unauthenticated reads.
    token: "${{secrets.PROTON_REGISTRY_READ_TOKEN}}"
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    registries:
      - proton
    # If authentication becomes necessary, reference a Dependabot secret
    # rather than checking a real credential into this file.

  - package-ecosystem: gradle
    directory: /vpn-core-android
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
