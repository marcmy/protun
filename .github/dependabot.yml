version: 2

# Proton's published Rust registry is readable without credentials.
# Explicitly registering the host allows Dependabot's outbound proxy to
# connect to it; Cargo's own .cargo/config.toml does not allow the host.
registries:
  proton:
    type: cargo-registry
    registry: proton
    url: https://rust-registry.proton.me/index/

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    registries:
      - proton

  - package-ecosystem: gradle
    directory: /vpn-core-android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
