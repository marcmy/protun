version: 2
# Proton publishes these crates publicly; registering the host allows
# Dependabot's otherwise restrictive network proxy to reach its Cargo index.
registries:
  proton:
    type: cargo-registry
    registry: proton
    url: https://rust-registry.proton.me/index/
    # Anonymous public registry; Dependabot still requires a token field.
    # This literal is NOT a secret or credential with access privileges.
    token: "anonymous"
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    registries:
      - proton
    # If authentication becomes necessary, reference a Dependabot secret
    # rather than checking a real credential into this file.

  - package-ecosystem: gradle
    directory: /vpn-core-android
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
