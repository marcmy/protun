name: Validate Rust and Android dependencies

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-format:
    name: Rust formatting and manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust formatting tools
        run: rustup component add rustfmt
      # Existing upstream sources are not rustfmt-clean; track this signal
      # without blocking new security/manifest checks until they are normalized.
      - name: Check Rust formatting (baseline report)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Validate manifest without resolving dependencies
        run: cargo metadata --no-deps --format-version 1 > /dev/null


  rust-check:
    name: Rust compilation and library tests (required)
    # The Proton dependency graph is now compatible; compilation failures are
    # mandatory CI failures, including future interface-version regressions.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Proton dependencies come from its separate sparse Cargo registry. Keep
      # this workflow read-only and do not expose credentials on untrusted PRs.
      - name: Require one Proton operating-system interface version
        shell: bash
        run: |
          cargo metadata --format-version 1 | jq -e '[.packages[] | select(.name == "proton-os-interface")] | length == 1' >/dev/null
          cargo tree -i 'proton-os-interface@0.3.5'
      - name: Compile all Rust targets (required)
        shell: bash
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee "$RUNNER_TEMP/rust-check.log"
          echo "### Rust compilation: passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Run library tests (required)
        run: cargo test --lib
      - name: Preserve Rust compilation diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-compile-log
          path: ${{ runner.temp }}/rust-check.log
          if-no-files-found: ignore

  rust-audit:
    name: Rust dependency advisory report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve dependencies for advisory check
        run: cargo generate-lockfile
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Report RustSec advisories without suppressing findings
        shell: bash
        run: |
          set +e
          cargo audit --json > "$RUNNER_TEMP/rustsec-report.json"
          status=$?
          set -e
          echo "### RustSec dependency audit" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && ! jq -e '.vulnerabilities.list | type == "array"' "$RUNNER_TEMP/rustsec-report.json" > /dev/null 2>&1; then
            echo "::error title=RustSec scan failed::No valid vulnerability report produced"
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning title=RustSec findings require review::The dependency graph contains known vulnerabilities. Download rustsec-report; findings have not been ignored or waived."
            echo "**Findings present (exit code $status).** Download the full rustsec-report artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No dependency vulnerabilities reported." >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -r '.vulnerabilities.list[]? | "- " + .advisory.id + ": " + .advisory.title' "$RUNNER_TEMP/rustsec-report.json" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Preserve machine-readable RustSec report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustsec-report
          path: ${{ runner.temp }}/rustsec-report.json
          if-no-files-found: warn
      # Cargo.lock is deliberately untracked in this upstream-style library.
      # Advisory findings are reported, never silently ignored.

  gradle-wrapper:
    name: Validate Android Gradle wrapper integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
