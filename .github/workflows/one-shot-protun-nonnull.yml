name: One-shot ProTun NonNull CodeQL fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codeql-nonnull-mib-tables
          fetch-depth: 0

      - name: Convert Win32 MIB pointers to NonNull
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path("src/connection/windows/helpers/local_ip_finder.rs")
          t = p.read_text()
          if "use std::ptr::NonNull;" not in t:
              t = t.replace(
                  "use std::net::{IpAddr, Ipv4Addr, Ipv6Addr};\n",
                  "use std::net::{IpAddr, Ipv4Addr, Ipv6Addr};\nuse std::ptr::NonNull;\n",
                  1,
              )
          old = '''        if routing_table.is_null() {
                      return Err(ProTunFatalError::NoLocalIp("GetIpForwardTable2 returned a null routing table".to_string()));
                  }
                  let routes: &[MIB_IPFORWARD_ROW2] = std::slice::from_raw_parts((*routing_table).Table.as_ptr(), (*routing_table).NumEntries as usize);

                  let mut ip_addresses_table: *mut MIB_UNICASTIPADDRESS_TABLE = std::ptr::null_mut();
                  if let Err(e) = GetUnicastIpAddressTable(AF_UNSPEC, &mut ip_addresses_table).ok() {
                      FreeMibTable(routing_table as _);
                      return Err(ProTunFatalError::NoLocalIp(format!("Error when getting the unicast IP address table. Win32 error code: {}", e.code())));
                  }
                  if ip_addresses_table.is_null() {
                      FreeMibTable(routing_table as _);
                      return Err(ProTunFatalError::NoLocalIp("GetUnicastIpAddressTable returned a null address table".to_string()));
                  }
                  let ip_addresses: &[MIB_UNICASTIPADDRESS_ROW] = std::slice::from_raw_parts((*ip_addresses_table).Table.as_ptr(), (*ip_addresses_table).NumEntries as usize);
          '''
          new = '''        let routing_table = NonNull::new(routing_table)
                      .ok_or_else(|| ProTunFatalError::NoLocalIp("GetIpForwardTable2 returned a null routing table".to_string()))?;
                  let routing_table_ref = routing_table.as_ref();
                  let routes: &[MIB_IPFORWARD_ROW2] = std::slice::from_raw_parts(
                      routing_table_ref.Table.as_ptr(),
                      routing_table_ref.NumEntries as usize,
                  );

                  let mut ip_addresses_table: *mut MIB_UNICASTIPADDRESS_TABLE = std::ptr::null_mut();
                  if let Err(e) = GetUnicastIpAddressTable(AF_UNSPEC, &mut ip_addresses_table).ok() {
                      FreeMibTable(routing_table.as_ptr() as _);
                      return Err(ProTunFatalError::NoLocalIp(format!("Error when getting the unicast IP address table. Win32 error code: {}", e.code())));
                  }
                  let Some(ip_addresses_table) = NonNull::new(ip_addresses_table) else {
                      FreeMibTable(routing_table.as_ptr() as _);
                      return Err(ProTunFatalError::NoLocalIp("GetUnicastIpAddressTable returned a null address table".to_string()));
                  };
                  let ip_addresses_table_ref = ip_addresses_table.as_ref();
                  let ip_addresses: &[MIB_UNICASTIPADDRESS_ROW] = std::slice::from_raw_parts(
                      ip_addresses_table_ref.Table.as_ptr(),
                      ip_addresses_table_ref.NumEntries as usize,
                  );
          '''
          if old not in t:
              raise SystemExit("local_ip_finder target changed")
          t = t.replace(old, new, 1)
          t = t.replace(
              "        FreeMibTable(routing_table as _);\n        FreeMibTable(ip_addresses_table as _);\n",
              "        FreeMibTable(routing_table.as_ptr() as _);\n        FreeMibTable(ip_addresses_table.as_ptr() as _);\n",
              1,
          )
          p.write_text(t)

          p = Path("src/connection/windows/helpers/routing_table.rs")
          t = p.read_text()
          if "use std::ptr::NonNull;" not in t:
              t = t.replace(
                  "use std::net::{Ipv4Addr, Ipv6Addr};\n",
                  "use std::net::{Ipv4Addr, Ipv6Addr};\nuse std::ptr::NonNull;\n",
                  1,
              )
          old = '''    if table_ptr.is_null() {
                  log::error!("GetIpForwardTable2 returned a null routing table");
                  return vec![];
              }

              let table: &MIB_IPFORWARD_TABLE2 = unsafe { &*table_ptr };
          '''
          new = '''    let Some(table_ptr) = NonNull::new(table_ptr) else {
                  log::error!("GetIpForwardTable2 returned a null routing table");
                  return vec![];
              };

              let table: &MIB_IPFORWARD_TABLE2 = unsafe { table_ptr.as_ref() };
          '''
          if old not in t:
              raise SystemExit("routing_table target changed")
          t = t.replace(old, new, 1)
          t = t.replace(
              "    unsafe { FreeMibTable(table_ptr as _) };\n",
              "    unsafe { FreeMibTable(table_ptr.as_ptr() as _) };\n",
              1,
          )
          p.write_text(t)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add src/connection/windows/helpers/local_ip_finder.rs src/connection/windows/helpers/routing_table.rs
          git commit -m "fix: model Win32 MIB tables as non-null"
          git push origin HEAD:fix/codeql-nonnull-mib-tables
