name: Diagnose Proton crate version compatibility

on:
  pull_request:
    paths:
      - Cargo.toml
      - '.github/workflows/rust-version-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-pairs:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Proton v2 release exact', pvpn: '3.0.1', muon: '2.0.3' }
          - { name: 'Proton v2 later muon', pvpn: '3.0.1', muon: '2.4.1' }
          - { name: 'Proton v2 latest muon', pvpn: '3.0.1', muon: '2.6.3' }
          - { name: 'Proton v3 release pair', pvpn: '4.0.0', muon: '3.0.0' }
          - { name: 'Proton current pair', pvpn: '4.4.0', muon: '4.1.0' }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Temporarily pin test versions without changing branch
        env:
          PVPN_VERSION: ${{ matrix.pvpn }}
          MUON_VERSION: ${{ matrix.muon }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          path = pathlib.Path("Cargo.toml")
          txt = path.read_text()
          txt, count1 = re.subn(r'(pvpnclient = \{ version = ")[^"]+', lambda m: m[1] + "=" + os.environ["PVPN_VERSION"], txt)
          txt, count2 = re.subn(r'(\[dependencies\.muon\]\nversion = ")[^"]+', lambda m: m[1] + "=" + os.environ["MUON_VERSION"], txt)
          assert count1 == 2 and count2 == 1, (count1,count2)
          path.write_text(txt)
          PY
      - name: Resolve and inspect shared interfaces
        shell: bash
        run: |
          cargo tree -i 'proton-os-interface@0.2.7' || true
          cargo tree -i 'proton-os-interface@0.3.5' || true
      - name: Require Rust library to compile
        run: cargo check --lib
